[project]
name = "course2book"
version = "0.1.0"
description = "Convierte cursos técnicos en video multi-formato a subtítulos .srt (faster-whisper CUDA) y libros prácticos exhaustivos en español para Obsidian."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "faster-whisper>=1.1.0",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
    "nvidia-cuda-runtime-cu12",
    "pillow>=10.0.0",
    "imagehash>=4.3.1",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
course2book = "course2book.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/course2book"]

[tool.uv]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
